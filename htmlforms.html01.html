<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
<p>Please Fill Out the form below to register for classes:</p>
<hr>
<h1>Personal details</h1>
<form>
    <label for="name">First Name:</label>
    <input type="text" id="name" name="name" placeholder="e.g: Arjun">
    <br><br>
    <label for="surname">Last Name:</label>
    <input type="text" id="surname" name="surname" placeholder="e.g: Kumar">
    <br><br>
    <label for="dob">DOB:</label>
    <input type="date" id="dob" name="dob">
    <br><br>
    <p>Gender:</p>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">
    <br><br>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">
    <br><br>
    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="other">
    <br><br>
    <p>Upload Your Photo:</p>
    <input type="file" id="photo" name="photo">
    <br><br>
    <hr>
    <h1>Contact Information</h1>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="e.g: nikhilbhomik@gmail.com">
    <br><br>
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="e.g: 123-456-7890">
    <br><br>
    <label for="address"> Mailing Address:</label>
    <textarea id="address" name="address" rows="4" cols="50" placeholder="e.g: 123 Main St, City, State, ZIP"></textarea>
    <br><br>
    <hr>




</form>
</body>
</html>
